services:
  # Web Service
  - type: web
    name: ai-trading-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --max-requests 200 --max-requests-jitter 20 --worker-tmp-dir /dev/shm --preload
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: INITIAL_CAPITAL
        value: 10000
      - key: MAX_POSITIONS
        value: 7
      - key: RISK_PER_TRADE
        value: 0.015
      - key: MIN_CONFIDENCE_SCORE
        value: 58                         # Lowered from 65 — temporary during ML cold start phase (need 20 trades to train)
      - key: VOLATILE_MARKET_MODE
        value: true                       # Enables 1.5% risk, 20% max position, tighter exits
      - key: ADAPTIVE_SCORING
        value: true
      - key: WATCHLIST_TYPE
        value: custom
      - key: SAVE_SCAN_DATA
        value: true
      - key: MIN_SCORE_TO_SAVE
        value: 50                         # Keep low — capture more rejection granularity
      - key: SCAN_DATA_RETENTION_DAYS
        value: 90
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: API_WEBHOOK_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading_bot_db
          property: connectionString

databases:
  - name: trading_bot_db
    databaseName: trading_bot
    user: trading_user
    plan: free
    region: singapore
