services:
  # Web Service
  - type: web
    name: ai-trading-bot
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: INITIAL_CAPITAL
        value: 5000
      - key: MAX_POSITIONS
        value: 5
      - key: RISK_PER_TRADE
        value: 0.02
      - key: MIN_CONFIDENCE_SCORE
        value: 70
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading_bot_db
          property: connectionString

databases:
  - name: trading_bot_db
    databaseName: trading_bot
    user: trading_user
    plan: free
    region: singapore
